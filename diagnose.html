<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>3分钟新手诊断 · Bass Practice Studio</title>
  <style>
    :root{--bg:#0e1115;--panel:#171b20;--panel2:#1c2229;--line:#303740;--text:#edf1f4;--muted:#98a2ac;--dim:#66717c;--coral:#ff7267;--soft:#ff726715;--mint:#51cfb2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#242b33 0,#0e1115 48%);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.shell{width:min(760px,calc(100% - 28px));margin:0 auto;padding:24px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:12px;font-weight:750}.mark{display:grid;place-items:center;width:31px;height:31px;border:1px solid #ff726755;border-radius:7px;background:var(--soft);color:var(--coral)}.exit{color:var(--muted);font-size:11px;text-decoration:none}.progress{height:4px;overflow:hidden;border-radius:4px;background:#252b32}.progress span{display:block;width:0;height:100%;border-radius:inherit;background:var(--coral);transition:width .25s}.step-label{margin:14px 0 36px;color:var(--dim);font-size:10px}.card{padding:clamp(24px,6vw,52px);border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#191e24,#13171c);box-shadow:0 24px 60px #0004}.eyebrow{color:var(--coral);font-size:9px;font-weight:800;letter-spacing:.12em}.card h1{max-width:620px;margin:12px 0 12px;font-size:clamp(27px,5vw,42px);line-height:1.18;letter-spacing:-.025em}.intro,.hint{color:var(--muted);font-size:12px;line-height:1.75}.options{display:grid;gap:10px;margin-top:28px}.option{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;min-height:60px;padding:10px 15px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);text-align:left;cursor:pointer}.option:hover,.option:focus-visible{border-color:#ff726777;outline:0}.option.selected{border-color:var(--coral);background:var(--soft)}.key{display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--line);border-radius:5px;color:var(--muted);font-size:10px}.option.selected .key{border-color:#ff726777;color:var(--coral)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:43px;border:0;border-radius:6px;padding:0 19px;background:var(--coral);color:#210a08;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none}.button:disabled{opacity:.35;cursor:not-allowed}.button.secondary{border:1px solid var(--line);background:transparent;color:var(--muted)}.result-card{text-align:left}.result-badge{display:inline-flex;padding:5px 8px;border:1px solid #51cfb244;border-radius:5px;background:#51cfb211;color:var(--mint);font-size:9px;font-weight:800}.result-card h1{margin-top:17px}.reason{margin:22px 0;padding:16px;border-left:3px solid var(--coral);background:var(--soft);color:#cbd1d6;font-size:12px;line-height:1.7}.result-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.result-facts div{padding:14px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}.result-facts span,.result-facts strong{display:block}.result-facts span{color:var(--dim);font-size:8px}.result-facts strong{margin-top:6px;font-size:11px}.notice{color:var(--dim);font-size:9px;line-height:1.6}.hidden{display:none!important}@media(max-width:600px){.shell{padding-top:15px}.top{margin-bottom:20px}.card{padding:25px 18px}.card h1{font-size:28px}.result-facts{grid-template-columns:1fr}.actions{flex-direction:column-reverse}.actions .button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><a class="brand" href="index.html"><span class="mark">B</span>Bass Practice Studio</a><a class="exit" href="index.html">暂时退出</a></header>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    <p class="step-label" id="stepLabel">准备开始</p>
    <section class="card" id="quizCard" aria-live="polite"></section>
  </main>
  <script>
    const STORAGE_KEY='bass-practice-studio-v1';
    const QUESTIONS=[
      {id:'hasBass',ability:'准备情况',title:'你现在手边有一把贝斯吗？',hint:'没有琴也可以完成诊断和预习，但实操需要等拿到琴以后。',options:[['yes','有，我现在可以练'],['no','没有，我想先学习']]},
      {id:'played',ability:'技术',title:'你能让贝斯发出清楚、稳定的声音吗？',hint:'只判断你现在是否会持琴和拨弦，不需要评价音色好坏。',options:[['no','还没有，我没怎么弹过'],['sometimes','偶尔可以，但动作不确定'],['yes','可以，我会基本持琴和拨弦']]},
      {id:'strings',ability:'找音',title:'不看提示，你知道四根空弦叫什么吗？',hint:'空弦是左手不按品格时弹出的声音。',options:[['no','不知道或只能说出一两根'],['partial','大概知道，但顺序会混'],['yes','知道，是 E、A、D、G']]},
      {id:'frets',ability:'找音',title:'你能在五品以内找到几个指定音吗？',hint:'例如别人说“找 G、A、C、D”，你能在琴上指出位置。',options:[['no','还不能'],['some','看提示可以找到'],['yes','不看提示也能找到几个']]},
      {id:'pulse',ability:'跟拍',title:'听到稳定拍子时，你能跟着数 1、2、3、4 吗？',hint:'这只帮助我们安排后面的练习，不会给你打分。',options:[['no','还不确定拍子是什么'],['some','能数，但容易跟丢'],['yes','可以稳定跟着数']]},
      {id:'harmony',ability:'换音',title:'看到 C、Am 这样的和弦名称时，你知道它们代表什么吗？',hint:'不知道很正常，现在不用先学完乐理。',options:[['no','完全不知道'],['some','见过，但不会用'],['yes','知道基本含义']]},
      {id:'expression',ability:'控制声音',title:'弹同一个音时，你会尝试控制轻重或长短吗？',hint:'只看你有没有注意过声音变化，不要求现在就能做好。',options:[['no','还没有注意过'],['some','试过，但控制不稳定'],['yes','会主动改变轻重或长短']]},
      {id:'transfer',ability:'自己继续',title:'换一个练习或换一根弦时，你通常能自己继续吗？',hint:'这只帮助我们判断你需不需要更多提示。',options:[['no','通常需要重新看示范'],['some','慢一点可以尝试'],['yes','可以自己找到方法']]}
    ];
    const ROUTES={
      posture:{title:'从持琴与拨弦开始',reason:'你现在最需要的不是记更多知识，而是先用放松的动作发出稳定声音。'},
      openStrings:{title:'从四根空弦开始',reason:'你已经可以让琴发声，先记住 E、A、D、G，建立最基础的指板坐标。'},
      firstFiveFrets:{title:'从五品以内找音开始',reason:'你已经认识四根空弦，可以用少量地标音继续建立指板地图。'}
    };
    let index=-1,answers={};
    const card=document.getElementById('quizCard'),bar=document.getElementById('progressBar'),label=document.getElementById('stepLabel');
    function renderIntro(){bar.style.width='0';label.textContent='准备开始';card.innerHTML=`<span class="eyebrow">3 分钟</span><h1>找到你的第一个贝斯练习</h1><p class="intro">回答 8 个简单问题。我们不会给你打等级，答案只用于选择一个合适的起点。</p><div class="result-facts"><div><span>需要多久</span><strong>约 3 分钟</strong></div><div><span>你会得到</span><strong>一个 5 分钟练习</strong></div><div><span>问题内容</span><strong>你现在会做什么</strong></div></div><button class="button" id="startBtn">开始回答</button>`;document.getElementById('startBtn').onclick=()=>{index=0;renderQuestion()}}
    function renderQuestion(){const q=QUESTIONS[index];bar.style.width=`${index/QUESTIONS.length*100}%`;label.textContent=`第 ${index+1} / ${QUESTIONS.length} 题 · ${q.ability}`;card.innerHTML=`<span class="eyebrow">${q.ability}</span><h1>${q.title}</h1><p class="hint">${q.hint}</p><div class="options">${q.options.map((item,i)=>`<button class="option ${answers[q.id]===item[0]?'selected':''}" data-value="${item[0]}"><span class="key">${'ABC'[i]}</span><span>${item[1]}</span></button>`).join('')}</div><div class="actions"><button class="button secondary" id="backBtn">${index?'上一题':'返回说明'}</button><button class="button" id="nextBtn" ${answers[q.id]?'':'disabled'}>${index===QUESTIONS.length-1?'查看结果':'下一题'}</button></div>`;card.querySelectorAll('.option').forEach(button=>button.onclick=()=>{answers[q.id]=button.dataset.value;renderQuestion()});document.getElementById('backBtn').onclick=()=>{if(index===0){index=-1;renderIntro()}else{index--;renderQuestion()}};document.getElementById('nextBtn').onclick=()=>{if(!answers[q.id])return;if(index<QUESTIONS.length-1){index++;renderQuestion()}else finish()}}
    function chooseRoute(){if(answers.played!=='yes')return'posture';if(answers.strings!=='yes')return'openStrings';return'firstFiveFrets'}
    function finish(){const route=chooseRoute(),result=ROUTES[route],hasBass=answers.hasBass==='yes',saved=load();saved.starter={diagnosis:{version:2,route,hasBass,answers,completedAt:new Date().toISOString()},practice:{started:false,previewDone:false},history:saved.starter?.history||[]};let stored=true;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(saved))}catch{stored=false}const handoff=`index.html?starterRoute=${encodeURIComponent(route)}&hasBass=${hasBass?'1':'0'}`;bar.style.width='100%';label.textContent='诊断完成';card.className='card result-card';card.innerHTML=`<span class="result-badge">你的学习起点</span><h1>${result.title}</h1><p class="reason">${result.reason}</p><div class="result-facts"><div><span>今天的内容</span><strong>${hasBass?'5 分钟实操':'5 分钟预习'}</strong></div><div><span>推荐依据</span><strong>你的问卷回答</strong></div><div><span>完成方式</span><strong>${hasBass?'按标准自评':'有琴后再实操'}</strong></div></div><p class="notice">这不是 AI 测评，也不是专业水平认证。${stored?'结果保存在当前浏览器。':'浏览器没有保存结果；返回首页后请允许本地存储，才能保留练习记录。'}</p><div class="actions"><button class="button secondary" id="restartBtn">重新诊断</button><a class="button" href="${handoff}">查看今天的练习</a></div>`;document.getElementById('restartBtn').onclick=()=>{answers={};index=0;renderQuestion()}}
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY))||{};return{songs:saved.songs||{},history:saved.history||[],starter:saved.starter||{history:[]}}}catch{return{songs:{},history:[],starter:{history:[]}}}}
    renderIntro();
  </script>
</body>
</html>
